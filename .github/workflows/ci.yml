name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -e ".[dev]"
    - name: Ruff
      run: ruff check petbox/dca test docs
    - name: Mypy
      run: mypy petbox/dca
    # The test tree and the docs scripts are type-checked too, and under --strict. The config
    # now sets every strict flag, so these agree with the plain run above -- but pinning
    # --strict explicitly means a flag dropped from pyproject.toml fails here rather than
    # silently widening what CI accepts. `-p test` rather than a path: `test/` is a package,
    # and passing the path makes mypy see test/data.py as both `data` and `test.data`.
    - name: Mypy (strict, package, tests and docs)
      run: |
        mypy --strict petbox/dca
        mypy --strict -p test
        mypy --strict docs

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install -e ".[dev]"
    - name: Run tests
      run: pytest
    - name: Upload coverage to Coveralls
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: coverallsapp/github-action@v2
      continue-on-error: true
      with:
        file: coverage.lcov
        format: lcov
