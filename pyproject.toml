[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petbox-dca"
version = "1.2.0"
description = "Decline Curve Library"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "MIT"
requires-python = ">=3.7"
authors = [
    {name = "David S. Fulford", email = "petbox-dev@gmail.com"},
]
keywords = [
    "petbox-dca", "dca", "decline curve", "type curve",
    "production forecast", "production data analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21.1",
    "scipy>=1.7.1",
]

[project.urls]
Homepage = "https://github.com/petbox-dev/dca"

[project.optional-dependencies]
dev = [
    "attrs>=19.2.0",
    "coverage>=5.1",
    "coveralls>=3.2.0",
    "hypothesis>=6.14.8",
    "mpmath>=1.3.0",
    "mypy>=0.910",
    "pytest>=6.2.4",
    "pytest-cov>=2.12.1",
    "ruff>=0.4.0",
    "wheel>=0.34.2",
]
docs = [
    "Sphinx<7.0.0",
    "sphinx-rtd-theme==1.2.2",
]

[tool.setuptools.packages.find]
include = ["petbox.dca"]

[tool.setuptools.package-data]
"petbox.dca" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py37"
exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "F401",   # imported but unused
    "F841",   # local variable assigned but never used
    "E116",   # unexpected indentation (comment)
    "E251",   # unexpected spaces around keyword / parameter default
    "E261",   # at least two spaces before inline comment
    "E265",   # block comment should start with '# '
    "E266",   # too many leading '#' for block comment
    "E302",   # expected 2 blank lines
    "E305",   # expected 2 blank lines after end of function/class
    "E402",   # module level import not at top of file
    "E722",   # do not use bare 'except'
    "W605",   # invalid escape sequence
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
plugins = ["numpy.typing.mypy_plugin"]

[tool.pytest.ini_options]
addopts = "--cov=petbox.dca --cov-report=term-missing --cov-config=pyproject.toml --hypothesis-show-statistics -v test"

[tool.coverage.run]
# branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
ignore_errors = true

[tool.coverage.html]
directory = "test/htmlcov"
