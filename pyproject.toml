[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petbox-dca"
version = "2.2.0"
description = "Decline Curve Library"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "David S. Fulford", email = "petbox-dev@gmail.com"},
]
keywords = [
    "petbox-dca", "dca", "decline curve", "type curve",
    "production forecast", "production data analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/petbox-dev/dca"

[project.optional-dependencies]
dev = [
    "attrs>=19.2.0",
    "coverage>=5.1",

    "hypothesis>=6.14.8",
    "mpmath>=1.3.0",
    "mypy>=1.0",
    "pytest>=6.2.4",
    "pytest-cov>=2.12.1",
    "ruff>=0.4.0",
    "wheel>=0.34.2",
]
docs = [
    "Sphinx<7.0.0",
    "sphinx-rtd-theme==1.2.2",
]

[tool.setuptools.packages.find]
include = ["petbox.dca"]

[tool.setuptools.package-data]
"petbox.dca" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "F401",   # imported but unused
    "F841",   # local variable assigned but never used
    "E116",   # unexpected indentation (comment)
    "E251",   # unexpected spaces around keyword / parameter default
    "E261",   # at least two spaces before inline comment
    "E265",   # block comment should start with '# '
    "E266",   # too many leading '#' for block comment
    "E302",   # expected 2 blank lines
    "E305",   # expected 2 blank lines after end of function/class
    "E402",   # module level import not at top of file
    "E722",   # do not use bare 'except'
    "W605",   # invalid escape sequence
]

[tool.ruff.lint.mccabe]
max-complexity = 20

# These flags now cover everything `--strict` implies, plus four it does not
# (disallow_any_unimported, no_implicit_optional, warn_unreachable, show_error_codes). Keeping
# them spelled out means `mypy petbox/dca` and `mypy --strict petbox/dca` agree; the list had
# drifted to 12 of strict's 14, so the CI command passed while `--strict` did not. If mypy adds
# a flag to strict, add it here too.
#
# What the three formerly-missing flags caught:
#   warn_return_any      -- 8 functions returning Any through a declared NDFloat, because
#                           typeshed types `float ** float` as Any (a negative base with a
#                           fractional exponent is complex) and np.where/np.diff as dtype[Any].
#   no_implicit_reexport -- no `__all__` in petbox/dca/__init__.py. This package ships py.typed,
#                           so a DOWNSTREAM consumer running strict got "Module petbox.dca does
#                           not explicitly export attribute MH" on ordinary usage.
#   extra_checks         -- nothing.
[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
plugins = ["numpy.typing.mypy_plugin"]

# Two modules mypy cannot resolve, declared here rather than as `# type: ignore` comments so
# the reasons live in one place and `warn_unused_ignores` can still police every inline ignore.
#
#   mpmath -- 1.3.0 ships neither stubs nor a py.typed marker, so the lazy import in
#             `THM._transDfn` is unanalyzable. Drop it if mpmath ever ships typing.
#   data   -- `test/doc_examples.py` is the figure-generating script, run from `test/` so that
#             `data.py` is a sibling on sys.path. Its `from data import ...` line is also
#             rendered into docs/examples.rst by a literalinclude, so it has to keep the form a
#             reader can copy; a relative `from .data import` would be wrong in both places.
#
# `mypy petbox/dca` prints `note: unused section(s): module = ['data']`, because the package
# never imports it and `warn_unused_configs` is on. That note is expected and exits 0. Two
# alternatives were tried and are worse: `mypy_path = ["test"]` makes mypy resolve `data`, but
# then `test/data.py` is reachable as both `data` and `test.data` and `mypy -p test` dies with
# "Source file found twice under different module names"; and excluding `doc_examples.py`
# outright would stop type-checking code that is published as documentation.
[[tool.mypy.overrides]]
module = [
    "mpmath.*",
    "data"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=petbox.dca --cov-report=term-missing --cov-report=lcov:coverage.lcov --cov-config=pyproject.toml --hypothesis-show-statistics -v test"

[tool.coverage.run]
# branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
ignore_errors = true

[tool.coverage.html]
directory = "test/htmlcov"
